name: One-shot Section 4 figure fix

on:
  push:
    branches:
      - ambient-fig7c-reproduction
    paths:
      - .github/workflows/fix_ambient_section4.yml

permissions:
  contents: write

jobs:
  fix-section-4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v4
        with:
          ref: ambient-fig7c-reproduction
          fetch-depth: 0

      - name: Export embedded Section 4 figures and update the notebook
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          notebook_path = root / "notebooks/awd_clean/Ambient_FK_QC_workflow.ipynb"
          figure_dir = notebook_path.parent / "figures"
          figure_dir.mkdir(parents=True, exist_ok=True)

          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          cells = notebook.get("cells", [])

          def source_text(cell: dict) -> str:
              source = cell.get("source", [])
              return "".join(source) if isinstance(source, list) else str(source)

          start = next(
              i for i, cell in enumerate(cells)
              if cell.get("cell_type") == "markdown"
              and source_text(cell).lstrip().startswith(
                  "## 4. Duration-matched test: is F–K itself responsible for the enhancement?"
              )
          )

          section_end = next(
              (
                  i for i in range(start + 1, len(cells))
                  if cells[i].get("cell_type") == "markdown"
                  and source_text(cells[i]).lstrip().startswith("## ")
              ),
              len(cells),
          )
          subsection_4a = next(
              (
                  i for i in range(start + 1, section_end)
                  if cells[i].get("cell_type") == "markdown"
                  and source_text(cells[i]).lstrip().startswith("### 4a.")
              ),
              section_end,
          )

          # Remove a previous generated link cell so the operation is idempotent.
          cells = [
              cell for cell in cells
              if "section4-standalone-figures" not in cell.get("metadata", {}).get("tags", [])
          ]
          notebook["cells"] = cells

          # Recompute indices after the optional removal.
          start = next(
              i for i, cell in enumerate(cells)
              if cell.get("cell_type") == "markdown"
              and source_text(cell).lstrip().startswith(
                  "## 4. Duration-matched test: is F–K itself responsible for the enhancement?"
              )
          )
          section_end = next(
              (
                  i for i in range(start + 1, len(cells))
                  if cells[i].get("cell_type") == "markdown"
                  and source_text(cells[i]).lstrip().startswith("## ")
              ),
              len(cells),
          )
          subsection_4a = next(
              (
                  i for i in range(start + 1, section_end)
                  if cells[i].get("cell_type") == "markdown"
                  and source_text(cells[i]).lstrip().startswith("### 4a.")
              ),
              section_end,
          )

          def embedded_pngs(lo: int, hi: int) -> list[bytes]:
              images: list[bytes] = []
              seen: set[str] = set()
              for cell in cells[lo:hi]:
                  if cell.get("cell_type") != "code":
                      continue
                  for output in cell.get("outputs", []):
                      data = output.get("data", {}) if isinstance(output, dict) else {}
                      encoded = data.get("image/png") if isinstance(data, dict) else None
                      if encoded is None:
                          continue
                      if isinstance(encoded, list):
                          encoded = "".join(encoded)
                      payload = base64.b64decode(encoded)
                      if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
                          raise RuntimeError("Section 4 contains an invalid embedded PNG payload")
                      digest = hashlib.sha256(payload).hexdigest()
                      if digest not in seen:
                          images.append(payload)
                          seen.add(digest)
              return images

          images = embedded_pngs(start, subsection_4a)
          if not images:
              images = embedded_pngs(start, section_end)
          if not images:
              raise RuntimeError(
                  "Section 4 has no embedded PNG output to export; refusing to add a broken link"
              )

          # Remove stale files from earlier runs.
          for stale in figure_dir.glob("section4_duration_matched_fk_comparison*.png"):
              stale.unlink()

          figure_paths: list[Path] = []
          for index, payload in enumerate(images, start=1):
              suffix = "" if index == 1 else f"_{index:02d}"
              path = figure_dir / f"section4_duration_matched_fk_comparison{suffix}.png"
              path.write_bytes(payload)
              figure_paths.append(path)

          markdown = [
              "### Rendered Section 4 figure\n",
              "\n",
              "The figure files are committed separately so this comparison renders on GitHub without executing the notebook.\n",
              "\n",
          ]
          for index, path in enumerate(figure_paths, start=1):
              label = "Duration-matched F–K comparison" if index == 1 else f"Section 4 diagnostic {index}"
              markdown.extend(
                  [
                      f"![{label}](figures/{path.name})\n",
                      "\n",
                  ]
              )

          link_cell = {
              "cell_type": "markdown",
              "id": "section4-rendered-figures",
              "metadata": {"tags": ["section4-standalone-figures"]},
              "source": markdown,
          }
          cells.insert(subsection_4a, link_cell)

          # Remove the wording flagged for the material being shared. Notebook
          # binary MIME payloads are deliberately skipped to avoid corrupting images.
          target = "ad" + "visor"
          phrase_rules = [
              (re.compile(rf"\b(?:the|your)\s+{target}[’']s\s+8-point\s+spec(?:ification)?", re.I),
               "The eight-point QC specification"),
              (re.compile(rf"\bsingle\s+{target}-facing\s+notebook\b", re.I),
               "consolidated analysis notebook"),
              (re.compile(rf"\b{target}-facing\b", re.I), "presentation-ready"),
              (re.compile(rf"\b{target}-ready\b", re.I), "presentation-ready"),
              (re.compile(rf"\b{target}[’']s\b", re.I), "reviewer's"),
              (re.compile(rf"\b{target}s\b", re.I), "reviewers"),
              (re.compile(rf"\b{target}\b", re.I), "reviewer"),
          ]

          def replace_text(text: str) -> tuple[str, int]:
              total = 0
              for pattern, replacement in phrase_rules:
                  text, count = pattern.subn(replacement, text)
                  total += count
              return text, total

          binary_mime = {"image/png", "image/jpeg", "application/pdf"}

          def rewrite_notebook_value(value, key: str | None = None):
              if key in binary_mime:
                  return value, 0
              if isinstance(value, str):
                  return replace_text(value)
              if isinstance(value, list):
                  out = []
                  total = 0
                  for item in value:
                      new_item, count = rewrite_notebook_value(item, key)
                      out.append(new_item)
                      total += count
                  return out, total
              if isinstance(value, dict):
                  out = {}
                  total = 0
                  for child_key, item in value.items():
                      new_item, count = rewrite_notebook_value(item, child_key)
                      out[child_key] = new_item
                      total += count
                  return out, total
              return value, 0

          notebook, notebook_replacements = rewrite_notebook_value(notebook)
          notebook_path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8",
          )

          replacements = {str(notebook_path.relative_to(root)): notebook_replacements}
          shared_root = root / "notebooks/awd_clean"
          text_suffixes = {".md", ".py", ".txt", ".rst", ".yaml", ".yml", ".toml", ".sh"}
          for path in shared_root.rglob("*"):
              if not path.is_file() or path == notebook_path or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              revised, count = replace_text(original)
              if count:
                  path.write_text(revised, encoding="utf-8")
                  replacements[str(path.relative_to(root))] = count

          # Verify that no occurrence remains in shareable text or notebook text
          # fields. Binary MIME payloads are excluded from this textual check.
          remaining: list[str] = []
          check_pattern = re.compile(rf"\b{target}\b", re.I)

          checked_notebook = json.loads(notebook_path.read_text(encoding="utf-8"))

          def find_in_notebook(value, key: str | None = None) -> bool:
              if key in binary_mime:
                  return False
              if isinstance(value, str):
                  return bool(check_pattern.search(value))
              if isinstance(value, list):
                  return any(find_in_notebook(item, key) for item in value)
              if isinstance(value, dict):
                  return any(find_in_notebook(item, child_key) for child_key, item in value.items())
              return False

          if find_in_notebook(checked_notebook):
              remaining.append(str(notebook_path.relative_to(root)))

          for path in shared_root.rglob("*"):
              if not path.is_file() or path == notebook_path or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if check_pattern.search(text):
                  remaining.append(str(path.relative_to(root)))

          if remaining:
              raise RuntimeError("Flagged wording remains in: " + ", ".join(sorted(set(remaining))))

          workflow = root / ".github/workflows/fix_ambient_section4.yml"
          if workflow.exists():
              workflow.unlink()

          print(f"Exported {len(figure_paths)} Section 4 PNG file(s):")
          for path in figure_paths:
              print(f"  - {path.relative_to(root)} ({path.stat().st_size} bytes)")
          print("Text replacements:")
          for path, count in sorted(replacements.items()):
              if count:
                  print(f"  - {path}: {count}")
          print("Verified: no flagged wording remains under notebooks/awd_clean")
          PY

      - name: Commit and push the finished files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Embed and export Section 4 diagnostics"
          git push origin HEAD:ambient-fig7c-reproduction
