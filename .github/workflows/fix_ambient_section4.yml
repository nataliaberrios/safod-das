name: One-shot Section 4 figure fix

on:
  workflow_dispatch:
  push:
    branches:
      - ambient-fig7c-reproduction
    paths:
      - .github/workflows/fix_ambient_section4.yml

permissions:
  contents: write

jobs:
  fix-section-4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v4
        with:
          ref: ambient-fig7c-reproduction
          fetch-depth: 0

      - name: Export, link, and verify Section 4 figures
        run: python .github/scripts/fix_ambient_section4.py

      - name: Commit and push the finished files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Embed and export Section 4 diagnostics"
          git push origin HEAD:ambient-fig7c-reproduction
