name: Temporary Section 4 maintenance

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix-section-4:
    if: github.event.issue.title == '[maintenance] Run Section 4 export'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v4
        with:
          ref: ambient-fig7c-reproduction
          fetch-depth: 1

      - name: Export, link, and verify Section 4 figures
        run: python .github/scripts/fix_ambient_section4.py

      - name: Commit and push the finished files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Embed and export Section 4 diagnostics"
          git push origin HEAD:ambient-fig7c-reproduction
